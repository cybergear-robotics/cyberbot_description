name: Export Onshape robot model

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: onshape-export-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  export:
    runs-on: ubuntu-24.04
    container:
      image: ubuntu:noble
    steps:
      - name: Set up ROS 2 Jazzy
        uses: ros-tooling/setup-ros@0.7.19
        with:
          required-ros-distributions: jazzy

      - name: Check out assets repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Trust runner workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install workflow tools and Onshape exporter
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gh \
            python3-catkin-pkg \
            python3-pytest \
            python3-venv \
            zip
          python3 -m venv "$RUNNER_TEMP/onshape-venv"
          "$RUNNER_TEMP/onshape-venv/bin/python" -m pip install --upgrade pip onshape-to-robot

      - name: Resolve current Onshape workspace/version
        id: source
        env:
          ONSHAPE_API: https://cad.onshape.com
          ONSHAPE_ACCESS_KEY: ${{ secrets.ONSHAPE_ACCESS_KEY }}
          ONSHAPE_SECRET_KEY: ${{ secrets.ONSHAPE_SECRET_KEY }}
        run: python3 scripts/onshape_source.py

      - name: Export model from Onshape
        env:
          ONSHAPE_API: https://cad.onshape.com
          ONSHAPE_ACCESS_KEY: ${{ secrets.ONSHAPE_ACCESS_KEY }}
          ONSHAPE_SECRET_KEY: ${{ secrets.ONSHAPE_SECRET_KEY }}
        run: |
          "$RUNNER_TEMP/onshape-venv/bin/onshape-to-robot" sdf

      - name: Save Assembly thumbnail for Onshape version
        if: steps.source.outputs.version_id != ''
        env:
          ONSHAPE_API: https://cad.onshape.com
          ONSHAPE_ACCESS_KEY: ${{ secrets.ONSHAPE_ACCESS_KEY }}
          ONSHAPE_SECRET_KEY: ${{ secrets.ONSHAPE_SECRET_KEY }}
          DOCUMENT_ID: ${{ steps.source.outputs.document_id }}
          VERSION_ID: ${{ steps.source.outputs.version_id }}
          ELEMENT_ID: ${{ steps.source.outputs.element_id }}
          VERSION_NAME: ${{ steps.source.outputs.source_name }}
        run: |
          python3 scripts/fetch_onshape_thumbnail.py \
            --document-id "$DOCUMENT_ID" \
            --version-id "$VERSION_ID" \
            --element-id "$ELEMENT_ID" \
            --version-name "$VERSION_NAME"

      - name: Install ROS package dependencies
        run: |
          rosdep update
          rosdep install --from-paths . --ignore-src --rosdistro jazzy --default-yes

      - name: Build and test exported description
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          echo "PATH=$PATH"
          echo "Default python3: $(command -v python3)"
          /usr/bin/python3 -c "import catkin_pkg, pytest; print('System Python ROS imports OK')"
          rm -rf build install log
          colcon build --packages-select cyberbot_description --cmake-args \
            -DPython3_EXECUTABLE=/usr/bin/python3
          source install/local_setup.bash
          colcon test --packages-select cyberbot_description
          colcon test-result --verbose

      - name: Commit updated model assets
        run: |
          if [[ -z "$(git status --porcelain -- sdf/robot.sdf sdf/model.config sdf/assets/ sdf/robot.png)" ]]; then
            echo "Onshape export produced no changes."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add sdf/robot.sdf sdf/model.config sdf/assets/ sdf/robot.png
            git commit -m "Update exported Onshape robot model"
            git push
          fi

      - name: Tag matching Onshape version
        if: steps.source.outputs.git_tag != ''
        env:
          VERSION_TAG: ${{ steps.source.outputs.git_tag }}
        run: |
          if ! git check-ref-format "refs/tags/$VERSION_TAG"; then
            echo "Onshape version name is not a valid Git tag: $VERSION_TAG" >&2
            exit 1
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/$VERSION_TAG" >/dev/null; then
            echo "Git tag $VERSION_TAG already exists; leaving the existing tag unchanged."
            exit 0
          fi

          git tag -a "$VERSION_TAG" -m "Onshape version $VERSION_TAG"
          git push origin "refs/tags/$VERSION_TAG"

      - name: Create GitHub Release for Onshape version
        if: steps.source.outputs.git_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_TAG: ${{ steps.source.outputs.git_tag }}
          SOURCE_NAME: ${{ steps.source.outputs.source_name }}
          SOURCE_ID: ${{ steps.source.outputs.source_id }}
          DOCUMENT_NAME: ${{ steps.source.outputs.document_name }}
          DOCUMENT_ID: ${{ steps.source.outputs.document_id }}
          ONSHAPE_URL: ${{ steps.source.outputs.onshape_url }}
          BRANCH_NAME: ${{ steps.source.outputs.branch_name }}
          BRANCH_WORKSPACE_ID: ${{ steps.source.outputs.branch_workspace_id }}
        run: |
          if gh release view "$VERSION_TAG" >/dev/null 2>&1; then
            echo "GitHub Release $VERSION_TAG already exists; leaving it unchanged."
            exit 0
          fi

          ARCHIVE="cyberbot-description-sdf-export.zip"
          zip -r -q "$ARCHIVE" sdf/robot.sdf sdf/model.config sdf/sensors.xml sdf/cyberbot_control.xml sdf/assets/ sdf/robot.png

          {
            echo "# Cyberbot CAD export — $VERSION_TAG"
            echo
            echo "- **Onshape document:** [$DOCUMENT_NAME]($ONSHAPE_URL) (ID: $DOCUMENT_ID)"
            echo "- **Onshape version:** $SOURCE_NAME (ID: $SOURCE_ID)"
            echo "- **Source branch:** $BRANCH_NAME (workspace ID: $BRANCH_WORKSPACE_ID)"
            echo "- **Export format:** SDF"
            echo "- **Git commit:** $(git rev-parse HEAD)"
            echo "- **Workflow run:** ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
            echo "## Included files"
            echo "- \`sdf/robot.sdf\`"
            echo "- \`sdf/model.config\`"
            echo "- \`sdf/sensors.xml\` and \`sdf/cyberbot_control.xml\`"
            echo "- \`sdf/robot.png\`"
            find sdf/assets -type f -print | LC_ALL=C sort | sed 's#^#- \`#; s#$#\`#'
          } > release-notes.md

          gh release create "$VERSION_TAG" \
            --title "Cyberbot $VERSION_TAG" \
            --notes-file release-notes.md \
            "$ARCHIVE#SDF model and mesh assets"
